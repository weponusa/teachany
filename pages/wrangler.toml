# Cloudflare Pages Functions 部署配置
# ============================================================
# 部署命令（在本目录执行）：
#   wrangler pages deploy public --project-name teachany-community
#
# 首次部署后在 Cloudflare Dashboard → Pages → teachany-community
# → Settings → Functions 完成：
#   1. KV namespace binding: RATE_LIMIT_KV → 绑已有的 namespace id
#   2. Secret: GITHUB_TOKEN = <fine-grained PAT>
# ============================================================

name = "teachany-community"
compatibility_date = "2025-04-01"
pages_build_output_dir = "public"

# ─── KV namespace（共享限频计数，跟旧 Worker 用同一个 namespace 即可）
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b3e581ff5304472887147e5e436e02db"

# ─── 环境变量（非敏感）
[vars]

# ─── 说明：GITHUB_TOKEN 必须用 `wrangler pages secret put` 单独设置
# wrangler pages secret put GITHUB_TOKEN --project-name teachany-community
