<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">蛋白质的结构层次与功能</text>
  <line x1="40" y1="55" x2="760" y2="55" stroke="#334155" stroke-width="1"/>
  <!-- 氨基酸 → 肽链 → 蛋白质 流程 -->
  <rect x="40" y="75" width="160" height="100" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold">氨基酸</text>
  <text x="120" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">R基不同 → 约20种</text>
  <text x="120" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">基本结构：NH₂-C-COOH</text>
  <!-- 箭头1 -->
  <line x1="200" y1="125" x2="240" y2="125" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="118" text-anchor="middle" fill="#fbbf24" font-size="10">脱水缩合</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker></defs>
  <rect x="245" y="75" width="160" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="325" y="110" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">多肽链</text>
  <text x="325" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">肽键：-CO-NH-</text>
  <text x="325" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">脱水数 = 肽键数</text>
  <!-- 箭头2 -->
  <line x1="405" y1="125" x2="445" y2="125" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425" y="118" text-anchor="middle" fill="#fbbf24" font-size="10">折叠盘曲</text>
  <rect x="450" y="75" width="160" height="100" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="530" y="110" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="bold">蛋白质</text>
  <text x="530" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">空间结构决定功能</text>
  <text x="530" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">结构多样 → 功能多样</text>
  <!-- 右侧：结构多样性 -->
  <rect x="640" y="75" width="140" height="100" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">多样性原因</text>
  <text x="710" y="122" text-anchor="middle" fill="#e2e8f0" font-size="11">氨基酸种类不同</text>
  <text x="710" y="142" text-anchor="middle" fill="#e2e8f0" font-size="11">数目不同</text>
  <text x="710" y="162" text-anchor="middle" fill="#e2e8f0" font-size="11">排列顺序不同</text>
  <!-- 蛋白质功能卡片 -->
  <text x="400" y="210" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">蛋白质的主要功能</text>
  <rect x="40" y="228" width="230" height="56" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <rect x="40" y="228" width="4" height="56" rx="2" fill="#60a5fa"/>
  <text x="55" y="252" fill="#e2e8f0" font-size="13">🔧 结构蛋白</text>
  <text x="55" y="272" fill="#94a3b8" font-size="11">肌肉、头发（角蛋白、胶原蛋白）</text>
  <rect x="285" y="228" width="230" height="56" rx="8" fill="#1e293b" stroke="#34d399"/>
  <rect x="285" y="228" width="4" height="56" rx="2" fill="#34d399"/>
  <text x="300" y="252" fill="#e2e8f0" font-size="13">⚡ 催化（酶）</text>
  <text x="300" y="272" fill="#94a3b8" font-size="11">绝大多数酶是蛋白质</text>
  <rect x="530" y="228" width="230" height="56" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <rect x="530" y="228" width="4" height="56" rx="2" fill="#fbbf24"/>
  <text x="545" y="252" fill="#e2e8f0" font-size="13">🚚 运输</text>
  <text x="545" y="272" fill="#94a3b8" font-size="11">血红蛋白运输 O₂</text>
  <rect x="40" y="296" width="230" height="56" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <rect x="40" y="296" width="4" height="56" rx="2" fill="#a78bfa"/>
  <text x="55" y="320" fill="#e2e8f0" font-size="13">🛡️ 免疫</text>
  <text x="55" y="340" fill="#94a3b8" font-size="11">抗体（免疫球蛋白）</text>
  <rect x="285" y="296" width="230" height="56" rx="8" fill="#1e293b" stroke="#f87171"/>
  <rect x="285" y="296" width="4" height="56" rx="2" fill="#f87171"/>
  <text x="300" y="320" fill="#e2e8f0" font-size="13">📡 信息传递</text>
  <text x="300" y="340" fill="#94a3b8" font-size="11">胰岛素（调节血糖）</text>
  <rect x="530" y="296" width="230" height="56" rx="8" fill="#1e293b" stroke="#22d3ee"/>
  <rect x="530" y="296" width="4" height="56" rx="2" fill="#22d3ee"/>
  <text x="545" y="320" fill="#e2e8f0" font-size="13">📏 调节</text>
  <text x="545" y="340" fill="#94a3b8" font-size="11">生长激素</text>
  <!-- 水印 -->
  <text x="700" y="490" fill="#475569" font-size="11">TeachAny · SVG 生成</text>
</svg>
