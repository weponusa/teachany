<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- 装饰圆 -->
  <circle cx="700" cy="60" r="120" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
  <circle cx="80" cy="420" r="100" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <!-- 顶部标签 -->
  <text x="400" y="35" text-anchor="middle" fill="#fbbf24" font-size="13">TeachAny · 高中生物</text>
  <!-- 大标题 -->
  <text x="400" y="80" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="bold">组成细胞的分子</text>
  <text x="400" y="110" text-anchor="middle" fill="#94a3b8" font-size="14">元素 · 化合物 · 糖类 · 脂质 · 蛋白质 · 核酸 · 水和无机盐</text>
  <line x1="200" y1="125" x2="600" y2="125" stroke="#334155" stroke-width="1"/>
  <!-- 核心知识图：中心辐射布局 -->
  <!-- 中心 -->
  <circle cx="400" cy="300" r="55" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">细胞中的</text>
  <text x="400" y="315" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">化合物</text>
  <!-- 水 -->
  <line x1="345" y1="280" x2="190" y2="200" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="100" y="170" width="130" height="55" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="165" y="195" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">水</text>
  <text x="165" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">自由水 · 结合水</text>
  <!-- 无机盐 -->
  <line x1="345" y1="310" x2="160" y2="370" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="70" y="345" width="130" height="55" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="135" y="370" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">无机盐</text>
  <text x="135" y="390" text-anchor="middle" fill="#94a3b8" font-size="11">离子形式为主</text>
  <!-- 糖类 -->
  <line x1="400" y1="245" x2="400" y2="175" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="330" y="145" width="140" height="55" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">糖类</text>
  <text x="400" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">主要能源物质</text>
  <!-- 脂质 -->
  <line x1="455" y1="280" x2="600" y2="195" stroke="#f87171" stroke-width="1.5"/>
  <rect x="540" y="165" width="140" height="55" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="610" y="190" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">脂质</text>
  <text x="610" y="210" text-anchor="middle" fill="#94a3b8" font-size="11">储能 · 结构 · 调节</text>
  <!-- 蛋白质 -->
  <line x1="455" y1="310" x2="620" y2="340" stroke="#34d399" stroke-width="1.5"/>
  <rect x="560" y="315" width="170" height="55" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="340" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">蛋白质</text>
  <text x="645" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">生命活动的主要承担者</text>
  <!-- 核酸 -->
  <line x1="400" y1="355" x2="400" y2="415" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="320" y="415" width="160" height="55" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="400" y="440" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">核酸</text>
  <text x="400" y="460" text-anchor="middle" fill="#94a3b8" font-size="11">遗传信息的携带者</text>
  <!-- 水印 -->
  <text x="700" y="490" fill="#475569" font-size="11">TeachAny · SVG 生成</text>
</svg>
