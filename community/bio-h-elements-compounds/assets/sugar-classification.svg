<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">糖类的分类与功能</text>
  <line x1="40" y1="55" x2="760" y2="55" stroke="#334155" stroke-width="1"/>
  <!-- 单糖 -->
  <rect x="40" y="75" width="220" height="170" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <rect x="40" y="75" width="220" height="4" rx="2" fill="#60a5fa"/>
  <text x="150" y="105" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">单糖</text>
  <text x="55" y="132" fill="#e2e8f0" font-size="13">葡萄糖（C₆H₁₂O₆）</text>
  <text x="55" y="155" fill="#94a3b8" font-size="12">→ 细胞生命活动的主要能源</text>
  <text x="55" y="180" fill="#e2e8f0" font-size="13">果糖、半乳糖、核糖</text>
  <text x="55" y="203" fill="#94a3b8" font-size="12">→ 不能水解的最小糖</text>
  <text x="55" y="228" fill="#fbbf24" font-size="12">★ 可直接被细胞吸收利用</text>
  <!-- 二糖 -->
  <rect x="290" y="75" width="220" height="170" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="290" y="75" width="220" height="4" rx="2" fill="#34d399"/>
  <text x="400" y="105" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">二糖</text>
  <text x="305" y="132" fill="#e2e8f0" font-size="13">蔗糖（植物）</text>
  <text x="305" y="155" fill="#e2e8f0" font-size="13">麦芽糖（植物）</text>
  <text x="305" y="180" fill="#e2e8f0" font-size="13">乳糖（动物）</text>
  <text x="305" y="203" fill="#94a3b8" font-size="12">→ 由2个单糖脱水缩合</text>
  <text x="305" y="228" fill="#fbbf24" font-size="12">★ 需水解为单糖才能吸收</text>
  <!-- 多糖 -->
  <rect x="540" y="75" width="220" height="170" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="540" y="75" width="220" height="4" rx="2" fill="#fbbf24"/>
  <text x="650" y="105" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">多糖</text>
  <text x="555" y="132" fill="#e2e8f0" font-size="13">淀粉（植物储能）</text>
  <text x="555" y="155" fill="#e2e8f0" font-size="13">糖原（动物储能）</text>
  <text x="555" y="180" fill="#e2e8f0" font-size="13">纤维素（植物结构）</text>
  <text x="555" y="203" fill="#94a3b8" font-size="12">→ 由多个葡萄糖聚合</text>
  <text x="555" y="228" fill="#fbbf24" font-size="12">★ 储能 + 结构功能</text>
  <!-- 功能总结 -->
  <rect x="40" y="270" width="720" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="300" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">糖类的功能</text>
  <text x="120" y="330" text-anchor="middle" fill="#e2e8f0" font-size="13">🔋 提供能量</text>
  <text x="300" y="330" text-anchor="middle" fill="#e2e8f0" font-size="13">🏗️ 构成细胞结构</text>
  <text x="500" y="330" text-anchor="middle" fill="#e2e8f0" font-size="13">📦 储存能量</text>
  <text x="680" y="330" text-anchor="middle" fill="#e2e8f0" font-size="13">🔗 参与信息识别</text>
  <text x="400" y="358" text-anchor="middle" fill="#94a3b8" font-size="12">糖类是主要的能源物质，约占人体每日所需能量的 70%</text>
  <!-- 箭头连线 -->
  <line x1="150" y1="248" x2="150" y2="270" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="400" y1="248" x2="400" y2="270" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="650" y1="248" x2="650" y2="270" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4"/>
  <!-- 水印 -->
  <text x="700" y="490" fill="#475569" font-size="11">TeachAny · SVG 生成</text>
</svg>
