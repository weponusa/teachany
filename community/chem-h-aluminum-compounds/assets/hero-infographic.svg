<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#451a03"/>
      <stop offset="100%" style="stop-color:#78350f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:.8"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:.2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="680" cy="80" r="140" fill="#f59e0b" opacity="0.07"/>
  <circle cx="120" cy="360" r="90" fill="#f59e0b" opacity="0.06"/>
  <!-- 顶部色条 -->
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- 图标 -->
  <text x="50" y="105" font-size="64" filter="url(#glow)">⚗️</text>
  <!-- 标题 -->
  <text x="50" y="158" font-size="32" font-weight="bold" fill="#f59e0b" filter="url(#glow)">铝及铝的化合物</text>
  <text x="50" y="185" font-size="13" fill="#f59e0b" opacity="0.7">TeachAny · K12 Interactive Courseware</text>
  <!-- 分隔线 -->
  <rect x="50" y="198" width="240" height="2" fill="#f59e0b" opacity="0.4" rx="1"/>
  <!-- 知识要点 -->
  <text x="50" y="210" font-size="13" fill="#e2e8f0" opacity="0.9">• Al₂O₃ 两性氧化物</text><text x="50" y="242" font-size="13" fill="#e2e8f0" opacity="0.9">• Al(OH)₃ 两性氢氧化物</text><text x="50" y="274" font-size="13" fill="#e2e8f0" opacity="0.9">• Al³⁺与OH⁻反应</text><text x="50" y="306" font-size="13" fill="#e2e8f0" opacity="0.9">• 铝热反应</text><text x="50" y="338" font-size="13" fill="#e2e8f0" opacity="0.9">• 工业炼铝</text>
  <!-- 右侧装饰 -->
  <rect x="560" y="30" width="200" height="360" rx="16" fill="#f59e0b" opacity="0.05"/>
  <text x="660" y="220" text-anchor="middle" font-size="96" opacity="0.15">⚗️</text>
  <!-- 底部标签 -->
  <rect x="50" y="378" width="80" height="22" rx="11" fill="#f59e0b" opacity="0.2"/>
  <text x="90" y="393" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="bold">TeachAny</text>
</svg>