<!--
================================================================
地图段模板 v7.0（Leaflet XYZ 瓦片 · Web Mercator · 自包含 · 三层对齐）
================================================================
用法：粘贴到 course-skeleton.html 的 {{MAP_SECTION}} 占位处。
填充变量：
  {{MAP_ID}}          地图 DOM id（默认 "history-map"）
  {{DYNASTY}}         朝代 id（tang-dynasty / north-song-dynasty / ...）
                      或世界切片 id（ce-1300-mongol-peak / ce-1945-wwii / ...）
  {{MAP_SCOPE}}       "china" 或 "world"

⭐ v7.0 重大变更：
  - 弃用 L.CRS.EPSG4326 + L.imageOverlay（equirectangular hillshade JPG）
  - 改用标准 XYZ 瓦片底图（Web Mercator）：CartoDB Dark + Esri Shaded Relief
  - GeoJSON 与瓦片底图原生对齐，无需投影转换
  - 保留自包含原则：GeoJSON 优先从课件自身 assets 加载

⭐ v6.4 自包含原则保留：'所有依赖要跟成果始终一起'
   课件要求：配套跑 bundle_map_assets.sh 把依赖拷进 ./assets/maps/
   加载顺序：
   1. 课件自身 ./assets/maps/{{DYNASTY}}.geojson  ← 永远 200
   2. 仓库 /teachany/data/geography/{china|world}/... （备用）
   3. 本地开发 ../data/...                         （开发备用）

发布前必须跑：
   bash ~/.codebuddy/skills/teachany/scripts/bundle_map_assets.sh <课件目录>
-->

<div class="map-container" id="{{MAP_ID}}" style="height:500px;width:100%;border-radius:14px;overflow:hidden;background:#0f172a"></div>

<script>
(async function() {
  const mapScope = "{{MAP_SCOPE}}";   // "china" | "world"
  const dynasty = "{{DYNASTY}}";
  const dir = mapScope === 'china' ? 'historical-china' : 'historical-world';

  // v7.0 自包含 fetch：第一优先从课件自身 assets 加载
  const LOCAL_BASE = './assets/maps';
  const FALLBACKS = [
    `/teachany/data/geography/${dir}`,
    `/teachany/data/_legacy/resources/geography/${dir}`,
    `../data/geography/${dir}`,
    `../../data/geography/${dir}`,
    `https://weponusa.github.io/teachany/data/geography/${dir}`,
    `https://weponusa.github.io/teachany/data/_legacy/resources/geography/${dir}`,
  ];

  async function fetchGeojson(id) {
    const candidates = [
      `${LOCAL_BASE}/${id}.geojson`,
      ...FALLBACKS.map(b => `${b}/${id}.geojson`),
    ];
    for (const url of candidates) {
      try {
        const r = await fetch(url);
        if (r.ok) return { url, data: await r.json() };
      } catch (_) {}
    }
    throw new Error(`地图加载失败：${id}`);
  }

  // ⭐ v7.0 XYZ 瓦片底图（Web Mercator 原生对齐）
  function addBaseTiles(map, opts = {}) {
    const terrainOpacity = opts.terrainOpacity ?? 0.4;
    const darkOpacity    = opts.darkOpacity    ?? 0.88;

    // 底层：CartoDB Dark —— 海陆分界+国界+地名
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      opacity: darkOpacity,
      attribution: '© CartoDB · © OpenStreetMap'
    }).addTo(map);

    // 叠加层：Esri Shaded Relief —— 山脉纹理（地形浮雕）
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 13,
      opacity: terrainOpacity,
      attribution: 'Esri · Shaded Relief'
    }).addTo(map);
  }

  // 1. 创建 Leaflet map（⭐ v7.0：使用默认 Web Mercator CRS，不再用 EPSG:4326）
  const map = L.map('{{MAP_ID}}', {
    center: mapScope === 'china' ? [34, 104] : [20, 30],
    zoom: mapScope === 'china' ? 4 : 2,
    minZoom: 2, maxZoom: 10,
  });

  // 2. ⭐ v7.0：XYZ 瓦片地形底图（替代旧版 imageOverlay hillshade JPG）
  addBaseTiles(map, {
    terrainOpacity: mapScope === 'china' ? 0.45 : 0.35,
    darkOpacity: mapScope === 'china' ? 0.9 : 0.85,
  });

  // 3. 政权配色
  const CHINA_POWER_COLORS = {
    '秦':'#8B008B','西汉':'#DC143C','东汉':'#CD5C5C','汉':'#DC143C',
    '魏':'#A52A2A','蜀':'#20B2AA','吴':'#3CB371',
    '唐':'#FFD700','北宋':'#4169E1','南宋':'#1E90FF',
    '辽':'#483D8B','金':'#8B4513','西夏':'#B8860B',
    '元':'#20B2AA','明':'#FF4500','清':'#FFD700',
    '吐蕃':'#A0A0A0','高丽':'#66CDAA','日本':'#E74C3C',
    '北方十六国':'#B22222','北魏':'#B22222','南朝':'#6B8E23',
    '隋':'#B8860B','西晋':'#808000','东晋':'#9ACD32',
    '蒙古':'#5D4037','大理':'#FF6B6B',
  };
  const chinaColor = p => CHINA_POWER_COLORS[p] || '#64748b';
  const hashColor = s => {
    if (!s) return '#64748b';
    let h = 0; for (const c of s) h = c.charCodeAt(0) + ((h << 5) - h);
    return `hsl(${Math.abs(h) % 360}, 55%, 48%)`;
  };

  // 4. 加载 GeoJSON（⭐ v7.0：与 XYZ 瓦片原生对齐，无需投影转换）
  try {
    const { data } = await fetchGeojson(dynasty);

    if (mapScope === 'china') {
      const countryFeats = data.features.filter(f => f.properties.LEVEL === 'country');
      const prefFeats = data.features.filter(f => f.properties.LEVEL !== 'country');

      // 中层：国家疆域轮廓（半透明底色+粗边）
      L.geoJSON(countryFeats, {
        style: f => ({
          color: chinaColor(f.properties.POWER),
          weight: 2.5, opacity: 0.95,
          fillColor: chinaColor(f.properties.POWER),
          fillOpacity: 0.22,
        }),
        onEachFeature: (f, l) => l.bindPopup(
          `<b>${f.properties.NAME_CH}</b>（疆域轮廓）<br/>政权: ${f.properties.POWER}`
        ),
      }).addTo(map);

      // 上层：府级细节（饱和色+细边）
      L.geoJSON(prefFeats, {
        style: f => ({
          color: '#1e293b', weight: 0.3, opacity: 0.6,
          fillColor: chinaColor(f.properties.POWER),
          fillOpacity: 0.55,
        }),
        onEachFeature: (f, l) => {
          const p = f.properties;
          l.bindPopup(
            `<b>${p.NAME_CH}</b>（${p.TYPE_CH || '府'}）<br/>` +
            `政权: ${p.POWER}<br/>存续: ${p.BEG_YR}~${p.END_YR}`
          );
        },
      }).addTo(map);

      // ⭐ 用 metadata.recommended_bbox 锁定视野
      const bbox = data.metadata?.recommended_bbox || [70, 15, 145, 55];
      map.fitBounds([[bbox[1], bbox[0]], [bbox[3], bbox[2]]]);
    } else {
      L.geoJSON(data, {
        style: f => ({
          color: '#0f172a', weight: 0.6, opacity: 0.7,
          fillColor: hashColor(f.properties.SUBJECTO || f.properties.NAME),
          fillOpacity: 0.55,
        }),
        onEachFeature: (f, l) => l.bindPopup(
          `<b>${f.properties.NAME || '未命名'}</b><br/>宗主: ${f.properties.SUBJECTO || '-'}`
        ),
      }).addTo(map);

      map.fitBounds([[-60, -180], [85, 180]]);
    }
  } catch (e) {
    document.getElementById('{{MAP_ID}}').innerHTML =
      '<div style="padding:40px;color:#94a3b8;text-align:center">' +
      '地图加载失败：' + (e.message || e) + '<br/>请刷新页面或检查网络。</div>';
  }
})();
</script>
