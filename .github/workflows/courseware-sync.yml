name: Sync Published Courseware Registry

on:
  repository_dispatch:
    types: [courseware-published]
  workflow_dispatch:
    inputs:
      courses:
        description: 'Comma-separated course ids to sync, or all if empty'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync redirect manifests from courseware repo
        shell: bash
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p community
          COURSES=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            COURSES=$(python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ.get('PAYLOAD','{}'))
          print(','.join(payload.get('courses') or []))
          PY
          )
          else
            COURSES="${{ github.event.inputs.courses }}"
          fi

          if [ -z "$COURSES" ]; then
            echo "No specific courses provided; nothing to sync."
            exit 0
          fi

          IFS=',' read -ra IDS <<< "$COURSES"
          for cid in "${IDS[@]}"; do
            cid=$(echo "$cid" | xargs)
            [ -z "$cid" ] && continue
            echo "Syncing $cid"
            mkdir -p "community/$cid"
            curl -fsSL "https://raw.githubusercontent.com/weponusa/teachany-courseware/main/community/$cid/manifest.json" \
              -o "community/$cid/manifest.json"
            cat > "community/$cid/index.html" <<EOF
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=https://weponusa.github.io/teachany-courseware/community/$cid/index.html">
            <link rel="canonical" href="https://weponusa.github.io/teachany-courseware/community/$cid/index.html">
            <title>TeachAny 课件已迁移</title>
            <script>location.replace('https://weponusa.github.io/teachany-courseware/community/$cid/index.html');</script>
            <style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:720px;margin:80px auto;padding:0 24px;line-height:1.8;color:#0f172a}a{color:#2563eb}</style>
          </head>
          <body>
            <h1>TeachAny 课件已迁移</h1>
            <p>该课件已迁移到新的课件资产仓库，正在自动跳转。</p>
            <p><a href="https://weponusa.github.io/teachany-courseware/community/$cid/index.html">如果没有自动跳转，请点击这里打开新地址</a></p>
          </body>
          </html>
          EOF
          done

      - name: Rebuild registry and knowledge indexes
        shell: bash
        run: |
          touch .teachany-admin
          python3 scripts/rebuild-index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.load(open('registry.json'))
          p=Path('registry-v2.json')
          v=json.load(open(p)) if p.exists() else {'version':'2.0','courses':[]}
          old={c.get('id'):c for c in v.get('courses',[]) if c.get('id')}
          out=[]
          for c in reg.get('courses',[]):
              item=old.get(c['id'], c)
              if 'url' in item and 'weponusa.github.io/teachany/community/' in str(item.get('url')):
                  item.pop('url', None)
              item.setdefault('path', c.get('path') or f"community/{c['id']}")
              out.append(item)
          v['courses']=sorted(out, key=lambda c:(c.get('subject',''), str(c.get('grade','')), c.get('id','')))
          v['total']=len(out)
          v['updated_at']='auto'
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit registry sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/ registry.json registry-v2.json community/index.json data/ scripts/teachany-kg-manifest.json scripts/unified-loader.js
          if git diff --cached --quiet; then
            echo "No registry changes."
          else
            git commit -m "registry: sync published courseware"
            git push origin main
          fi

      - name: Build site whitelist
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          for dir in assets community data scripts styles gallery pages; do
            [ -d "$dir" ] && cp -r "$dir" _site/
          done
          cp *.html _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          find _site -type f \( -name "*.py" -o -name "*.pyc" -o -name "*.sh" -o -name "*.cjs" -o -name "*.log" \) -delete 2>/dev/null || true
          find _site -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find _site -type d -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
          find _site -type l -delete 2>/dev/null || true
          touch _site/.nojekyll

      - name: Deploy registry site to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          DEPLOY_DIR="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DEPLOY_DIR" || {
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git checkout --orphan gh-pages
            git rm -rf . || true
          }
          cd "$DEPLOY_DIR"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/_site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: registry sync ${GITHUB_SHA}"
            git push origin gh-pages
          fi
