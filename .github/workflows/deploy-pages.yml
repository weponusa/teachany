name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'skill/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site whitelist
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          for dir in assets community data scripts styles gallery pages; do
            [ -d "$dir" ] && cp -r "$dir" _site/
          done
          cp *.html _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "size=$(du -sh _site | cut -f1)"
          echo "files=$(find _site -type f | wc -l)"

      - name: Deploy incrementally to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
