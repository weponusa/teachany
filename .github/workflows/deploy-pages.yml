name: Redirect GitHub Pages to teachany.cn

# teachany 仓不再托管完整门户；仅维护 gh-pages 跳转到 www.teachany.cn
on:
  push:
    branches: [main]
    paths:
      - '.github/pages-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-teachany-redirect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Write redirect site
        run: |
          set -euo pipefail
          rm -rf gh-pages/*
          cp -R .github/pages-redirect/* gh-pages/
          touch gh-pages/.nojekyll

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "deploy: redirect portal to www.teachany.cn"
          git push origin HEAD:gh-pages
