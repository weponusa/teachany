name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare static site
        run: |
          set -e
          echo "=== 准备部署文件 ==="
          
          # 创建输出目录
          mkdir -p _site
          
          # 复制所有 HTML 文件
          cp *.html _site/ 2>/dev/null || true
          
          # 复制 JSON 数据文件
          cp registry.json _site/ 2>/dev/null || true
          cp registry-v2.json _site/ 2>/dev/null || true
          cp manifest.json _site/ 2>/dev/null || true
          cp courseware-registry.json _site/ 2>/dev/null || true
          
          # 复制必需目录
          for dir in scripts data assets community gallery styles; do
            [ -d "$dir" ] && cp -r "$dir" _site/
          done
          
          # .nojekyll 确保不触发 Jekyll 构建
          touch _site/.nojekyll
          
          echo "=== 部署内容 ==="
          echo "HTML 文件: $(ls _site/*.html 2>/dev/null | wc -l)"
          echo "registry.json: $([ -f _site/registry.json ] && echo YES || echo NO)"
          echo "registry-v2.json: $([ -f _site/registry-v2.json ] && echo YES || echo NO)"
          echo "unified-loader.js REGISTRY_URL: $(grep REGISTRY_URL _site/scripts/unified-loader.js 2>/dev/null | head -1)"
          echo "总文件数: $(find _site -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
