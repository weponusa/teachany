name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy gh-pages via git
        run: |
          set -e

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 切到 gh-pages 分支（orphan 保证干净）
          git checkout --orphan gh-pages-tmp

          # 删除不需要部署的目录/文件
          rm -rf .github skill .git
          find . -name "*.py" -delete
          find . -name "*.sh" -delete

          # 确保 .nojekyll 存在
          touch .nojekyll

          echo "📄 index.html 存在: $([ -f index.html ] && echo YES || echo NO)"
          echo "📄 registry.json 存在: $([ -f registry.json ] && echo YES || echo NO)"
          echo "📄 文件总数: $(find . -type f | wc -l)"

          git add -A
          git commit -m "deploy: $(git rev-parse --short HEAD~0 2>/dev/null || echo unknown)"

          # 强制推送 gh-pages
          git push origin gh-pages-tmp:gh-pages --force
