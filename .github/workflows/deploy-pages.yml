name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'skill/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (whitelist only)
        run: |
          mkdir -p _site
          # 仅复制网站运行必需的内容，避开 skill/、output/、references/ 等开发用大目录
          cp -r assets _site/ 2>/dev/null || true
          cp -r community _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          cp -r scripts _site/ 2>/dev/null || true
          cp -r styles _site/ 2>/dev/null || true
          cp -r gallery _site/ 2>/dev/null || true
          cp -r pages _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "=== 部署摘要 ==="
          echo "Total size: $(du -sh _site | cut -f1)"
          echo "Total files: $(find _site -type f | wc -l)"
          echo "registry-v2 total: $(python3 -c 'import json;print(json.load(open(\"_site/registry-v2.json\"))[\"total\"])' 2>/dev/null || echo N/A)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
