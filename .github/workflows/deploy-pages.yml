name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p _site

          # 1. 根目录 HTML 页面
          cp *.html _site/ 2>/dev/null || true

          # 2. 配置文件
          cp manifest.json _site/
          cp registry.json _site/
          cp courseware-registry.json _site/ 2>/dev/null || true
          [ -f .nojekyll ] && cp .nojekyll _site/ || touch _site/.nojekyll
          [ -f README.md ] && cp README.md _site/

          # 3. 必需目录
          [ -d scripts ]     && cp -r scripts     _site/
          [ -d styles ]      && cp -r styles      _site/
          [ -d examples ]    && cp -r examples    _site/
          [ -d gallery ]     && cp -r gallery     _site/
          [ -d docs ]        && cp -r docs        _site/
          [ -d community ]   && cp -r community   _site/
          [ -d screenshots ] && cp -r screenshots _site/
          [ -d assets ]      && cp -r assets      _site/

          # 4. data 目录（排除 >5MB 文件）
          mkdir -p _site/data
          find data -name "*.json" -size -5M | while read f; do
            mkdir -p "_site/$(dirname "$f")"
            cp "$f" "_site/$f"
          done
          find data \( -name "*.py" -o -name "*.md" \) | while read f; do
            mkdir -p "_site/$(dirname "$f")"
            cp "$f" "_site/$f"
          done

          echo "📦 _site size: $(du -sh _site | cut -f1)"
          echo "📄 HTML pages: $(ls _site/*.html 2>/dev/null | wc -l)"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false

