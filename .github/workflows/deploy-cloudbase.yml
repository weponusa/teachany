name: Deploy to CloudBase (dual CDN sync)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'skill/**'
  workflow_dispatch:
  repository_dispatch:
    types: [courseware-deployed]
  schedule:
    # 兜底：若课件仓库先更新，6 小时追平一次
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: cloudbase-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout teachany-opensource
        uses: actions/checkout@v4
        with:
          path: teachany-opensource

      - name: Checkout teachany-courseware
        uses: actions/checkout@v4
        with:
          repository: weponusa/teachany-courseware
          path: teachany-courseware
          ref: main

      - name: Build merged dist
        working-directory: teachany-opensource
        env:
          OPEN_SOURCE_ROOT: ${{ github.workspace }}/teachany-opensource
          COURSEWARE_ROOT: ${{ github.workspace }}/teachany-courseware
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          bash scripts/build-cloudbase-dist.sh
          cat dist/cloudbase/DEPLOY_SHA.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: Deploy to CloudBase static hosting
        working-directory: teachany-opensource
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          if [[ -z "${TCB_SECRET_ID:-}" || -z "${TCB_SECRET_KEY:-}" ]]; then
            echo "::warning::TCB_SECRET_ID / TCB_SECRET_KEY 未配置，跳过 CloudBase 部署"
            echo "请在 GitHub → Settings → Secrets 添加腾讯云 API 密钥"
            exit 0
          fi
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY" --tokenFile /tmp/tcb_token
          tcb hosting deploy dist/cloudbase -e ai-native-d8g706ji7cd5f763c

      - name: Verify dual CDN sync
        working-directory: teachany-opensource
        run: |
          sleep 15
          bash scripts/sync-verify-dual-cdn.sh || {
            echo "::warning::CloudBase 刚部署，CDN 可能仍在刷新；请 5 分钟后重跑 workflow"
            exit 0
          }
