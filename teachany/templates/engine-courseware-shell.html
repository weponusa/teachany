<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="course-id" content="math-m-linear-function-lab">
<meta name="course-node" content="math-m-linear-function">
<meta name="course-subject" content="math">
<meta name="course-title" content="一次函数的图像与性质（引擎验证版）">
<title>《一次函数的图像与性质》 · 初中数学 G8 · TeachAny 引擎验证</title>
<style>
:root {
  --bg: #f8fafc; --primary: #3b82f6; --secondary: #06b6d4; --accent: #f59e0b;
  --card: #ffffff; --text: #1e293b; --text-light: #64748b;
  --success: #10b981; --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
.container { max-width: 860px; margin: 0 auto; padding: 16px; }
.hero { background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); color: #fff; border-radius: var(--radius); padding: 36px 30px; margin-bottom: 22px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: rgba(255,255,255,.08); border-radius: 50%; }
.hero h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
.hero .sub { opacity: .92; font-size: .95rem; }
.hero .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.tag { background: rgba(255,255,255,.2); padding: 3px 12px; border-radius: 20px; font-size: .78rem; }
.card { background: var(--card); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border-top: 4px solid var(--primary); }
.card.secondary { border-top-color: var(--secondary); }
.card.accent { border-top-color: var(--accent); }
.section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; padding-left: 12px; border-left: 4px solid var(--primary); }
.tp { margin-bottom: 14px; }
.tp h3 { font-size: .95rem; color: var(--primary); margin-bottom: 4px; }
.tp p { font-size: .9rem; color: var(--text-light); }
.challenge { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 12px; margin-bottom: 10px; background: #fffbeb; }
.challenge .no { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .85rem; }
.challenge .task { font-size: .92rem; font-weight: 600; }
.challenge .check { font-size: .8rem; color: var(--text-light); margin-top: 2px; }
.engine-badge { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--text-light); margin-top: 8px; }
.engine-badge code { background: #e2e8f0; border-radius: 6px; padding: 1px 7px; font-size: .72rem; }
.load-fail { padding: 18px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; border-radius: 12px; font-size: .9rem; }
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <h1 id="kb-title">一次函数的图像与性质</h1>
    <div class="sub" id="kb-subtitle">拖动滑块，看 k 和 b 如何改变直线</div>
    <div class="tags">
      <span class="tag">初中数学 G8</span>
      <span class="tag" id="kb-formula">y = kx + b</span>
      <span class="tag">交互实验</span>
    </div>
    <div class="engine-badge">驱动引擎 <code id="engine-tag">function-lab@v1</code> · 配置即课件</div>
  </div>

  <!-- 实验区：引擎挂载点 -->
  <div class="card">
    <div class="section-title">图像实验室</div>
    <div id="engine-host"></div>
  </div>

  <!-- 教学要点：由 config 渲染 -->
  <div class="card secondary">
    <div class="section-title">三个必懂结论</div>
    <div id="teaching-points"></div>
  </div>

  <!-- 挑战任务：由 config 渲染 -->
  <div class="card accent">
    <div class="section-title">动手挑战</div>
    <div id="challenges"></div>
  </div>

</div>

<!-- 引擎加载：生产环境为中央绝对地址，本地 POC 用相对路径 -->
<script src="../../assets/engines/function-lab/v1/engine.js"></script>
<script>
(async function bootstrap() {
  var host = document.getElementById('engine-host');
  function fail(msg) {
    host.innerHTML = '<div class="load-fail">课件引擎加载失败：' + msg + '</div>';
  }
  var config;
  try {
    var res = await fetch('./courseware.config.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    config = await res.json();
  } catch (e) { return fail('读取 courseware.config.json 出错（' + e.message + '）'); }

  var engine = window.TeachAnyEngines && window.TeachAnyEngines[config.engine];
  if (!engine || typeof engine.mount !== 'function') {
    return fail('引擎 ' + config.engine + ' 未注册');
  }
  if (String(engine.version) !== String(config.engineVersion)) {
    console.warn('[TeachAny] 引擎版本不匹配: 课件要求 v' + config.engineVersion + '，实际 v' + engine.version);
  }

  // 渲染知识区块
  document.getElementById('kb-title').textContent = config.knowledge.title;
  document.getElementById('kb-subtitle').textContent = config.knowledge.subtitle || '';
  document.getElementById('kb-formula').textContent = config.knowledge.formula;
  document.getElementById('engine-tag').textContent = config.engine + '@v' + engine.version;

  document.getElementById('teaching-points').innerHTML = (config.teachingPoints || [])
    .map(function (tp) { return '<div class="tp"><h3>' + tp.title + '</h3><p>' + tp.body + '</p></div>'; }).join('');
  document.getElementById('challenges').innerHTML = (config.challenges || [])
    .map(function (c, i) {
      return '<div class="challenge"><div class="no">' + (i + 1) + '</div><div>' +
        '<div class="task">' + c.task + '</div><div class="check">判定：' + c.check + '</div></div></div>';
    }).join('');

  // 挂载引擎
  var instance = engine.mount(host, config);
  window.__courseEngine = instance; // 便于调试/AI tutor 联动
})();
</script>
</body>
</html>
